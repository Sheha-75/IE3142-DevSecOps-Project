name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: webgoat-src
  JAVA_VERSION: "25"
  IMAGE_NAME: ie3142-webgoat

jobs:

  # ============================================================
  # 1. SAST - Semgrep Community Edition
  # ============================================================
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --severity ERROR \
            --error

  # ============================================================
  # 2. SCA - OWASP Dependency Check
  # ============================================================
  dependency-scan:
    name: SCA - OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: ${{ env.APP_DIR }}
        run: chmod +x mvnw

      - name: Run OWASP Dependency Check
        working-directory: ${{ env.APP_DIR }}
        run: |
          ./mvnw \
            org.owasp:dependency-check-maven:13.0.0:check \
            -DskipTests \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML,JSON

  # ============================================================
  # 3. Secret Scanning - Gitleaks
  # ============================================================
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 4. Build + Unit Tests
  # ============================================================
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: ${{ env.APP_DIR }}
        run: chmod +x mvnw

      - name: Run tests
        working-directory: ${{ env.APP_DIR }}
        run: ./mvnw test

      - name: Build application
        working-directory: ${{ env.APP_DIR }}
        run: ./mvnw -DskipTests package

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: webgoat-application
          path: ${{ env.APP_DIR }}/target/webgoat-*.jar
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # 5. Docker Build
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - build-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download application JAR
        uses: actions/download-artifact@v5
        with:
          name: webgoat-application
          path: ${{ env.APP_DIR }}/target

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

  # ============================================================
  # 6. Trivy Container Security Scan
  # ============================================================
  trivy:
    name: Trivy - Container Vulnerability Scan
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download application JAR
        uses: actions/download-artifact@v5
        with:
          name: webgoat-application
          path: ${{ env.APP_DIR }}/target

      - name: Build Docker image for scanning
        run: |
          docker build \
            -f docker/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ============================================================
  # 7. Final Security Gate
  # ============================================================
  security-gate:
    name: DevSecOps Security Gate
    runs-on: ubuntu-latest

    if: always()

    needs:
      - sast
      - dependency-scan
      - secret-scan
      - build-test
      - docker-build
      - trivy

    steps:
      - name: Evaluate security pipeline
        env:
          SAST_RESULT: ${{ needs.sast.result }}
          SCA_RESULT: ${{ needs.dependency-scan.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          BUILD_RESULT: ${{ needs.build-test.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}

        run: |
          echo "=========================================="
          echo "       DEVSECOPS SECURITY GATE"
          echo "=========================================="

          echo "SAST              : $SAST_RESULT"
          echo "Dependency Scan   : $SCA_RESULT"
          echo "Secret Scan       : $SECRET_RESULT"
          echo "Build & Tests     : $BUILD_RESULT"
          echo "Docker Build      : $DOCKER_RESULT"
          echo "Trivy             : $TRIVY_RESULT"

          echo "=========================================="

          if [ "$SAST_RESULT" != "success" ] || \
             [ "$SCA_RESULT" != "success" ] || \
             [ "$SECRET_RESULT" != "success" ] || \
             [ "$BUILD_RESULT" != "success" ] || \
             [ "$DOCKER_RESULT" != "success" ] || \
             [ "$TRIVY_RESULT" != "success" ]; then

            echo "SECURITY GATE: FAILED"
            exit 1
          fi

          echo "SECURITY GATE: PASSED"